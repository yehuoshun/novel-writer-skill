name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 打包 zip（tag 时刻完整内容）
        run: git archive --format=zip -o "novel-writer-skill-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: 生成发布说明（git log 中文）
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --abbrev=0 --tags --match 'v[0-9]*' "${TAG}^" 2>/dev/null || echo "")
          BODY="## 📦 novel-writer-skill ${TAG}"
          BODY+=$'\n\n### 更新内容'
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges "${PREV}..${TAG}" | sed 's/^/- /')
            BODY+=$'\n'"${LOG}"
          else
            BODY+=$'\n\n首次发布'
          fi
          BODY+=$'\n\n[查看文档](https://github.com/yehuoshun/novel-writer-skill#readme)'
          printf '%s' "$BODY" > release_body.md
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          files: "novel-writer-skill-${{ github.ref_name }}.zip"
          body: ${{ steps.notes.outputs.body }}

      # 钉钉通知：tag push 事件无 commits，action 的 push() 会发「0 提交」空消息；
      # 且默认 GITHUB_TOKEN 创建的 release 不会级联触发监听 release 事件的 workflow。
      # 故在此自包含发送（带完整 changelog）。
      - name: 钉钉通知（Release）
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 tools/notify-release.py release_body.md
