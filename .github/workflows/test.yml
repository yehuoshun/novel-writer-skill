name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 运行测试（node 内置 test runner，零依赖）
        run: node --test

      - name: 集成回归（生命周期 + 备份快照）
        run: |
          bash tools/simulate-lifecycle.sh
          bash tools/simulate-backup.sh
