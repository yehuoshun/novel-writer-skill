name: Notify

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: yehuoshun/yehuoshun-notify@v1
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
